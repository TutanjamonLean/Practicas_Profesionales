<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Logo BiblioTech">
  <title>Logo BiblioTech</title>
  <!-- Libro abierto - pagina izquierda -->
  <path d="M 60 25 L 60 95 M 10 40 L 60 25 L 60 95 L 10 80 Z" fill="#0d2b44" stroke="#0d2b44" stroke-width="2" stroke-linejoin="round"/>
  <!-- Libro abierto - pagina derecha -->
  <path d="M 60 25 L 110 40 L 110 80 L 60 95 Z" fill="#0d2b44" stroke="#0d2b44" stroke-width="2" stroke-linejoin="round"/>
  <!-- Pagina izquierda (interior) -->
  <path d="M 15 42 L 58 28 L 58 91 L 15 77 Z" fill="#ffffff" stroke="none"/>
  <!-- Pagina derecha (interior) -->
  <path d="M 62 28 L 105 42 L 105 77 L 62 91 Z" fill="#ffffff" stroke="none"/>
  <!-- Linea de pliegue central -->
  <line x1="60" y1="25" x2="60" y2="95" stroke="#0d2b44" stroke-width="3" stroke-linecap="round"/>
  <!-- Letra B mayuscula en la pagina izquierda -->
  <text x="28" y="68" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#0d2b44" text-anchor="middle">B</text>
  <!-- Separador decorativo inferior -->
  <rect x="10" y="96" width="100" height="5" rx="2" fill="#c9a227"/>
  <rect x="40" y="104" width="40" height="3" rx="1.5" fill="#c9a227"/>
</svg>